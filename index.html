<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For You</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg" id="bg"></div>

  <main class="stage">
    <section class="letter" id="letter">
      <div class="seal">💌</div>
      <p class="to">My love,</p>
      <h1>I'm sorry,<br />please come back</h1>
      <p class="sub">I miss you more than words can say.</p>

      <div class="actions" id="actions">
        <button id="yesBtn" class="btn yes">Okay, I will come back 💖</button>
        <button id="noBtn" class="btn no">No</button>
      </div>

      <p class="hint" id="hint">&nbsp;</p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
